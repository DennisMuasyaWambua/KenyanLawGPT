name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two deploys at once; cancel nothing mid-flight but queue them.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Decide which parts changed so we only deploy what we need to.
  detect:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'law.py'
              - 'manage.py'
              - 'requirements-prod.txt'
              - 'law_app/**'
              - 'law_project/**'
              - 'gateway/**'
              - 'static/**'
              - '.github/workflows/deploy.yml'

  deploy-frontend:
    needs: detect
    # Deploy on any manual run, or when frontend files changed.
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        # VITE_API_BASE_URL comes from frontend/.env.production (committed).
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy static files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            frontend/dist/ "$SSH_USER@$SSH_HOST:/var/www/wakili/"
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
          set -euo pipefail
          chown -R www-data:www-data /var/www/wakili
          # Smoke check: confirm the build actually landed on disk.
          test -f /var/www/wakili/index.html
          ls /var/www/wakili/assets/*.js >/dev/null 2>&1 || { echo "::error::No JS assets deployed"; exit 1; }
          echo "Frontend smoke check OK: index.html + assets present"
          EOF

  deploy-backend:
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync code
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        # --delete keeps the server clean; excluded paths (state + secrets)
        # are protected from deletion by rsync automatically.
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='frontend' \
            --exclude='venv' \
            --exclude='vector_db' \
            --exclude='.env' \
            --exclude='*.log' \
            --exclude='db.sqlite3' \
            --exclude='staticfiles' \
            --exclude='__pycache__' \
            --exclude='node_modules' \
            ./ "$SSH_USER@$SSH_HOST:/opt/law/"

      - name: Migrate, collectstatic, restart, reload nginx, smoke-check
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/law
          set -a; . ./.env; set +a
          venv/bin/pip install -q -r requirements-prod.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
          venv/bin/python manage.py migrate --noinput
          venv/bin/python manage.py collectstatic --noinput
          systemctl restart law
          sleep 3
          systemctl is-active law

          # Reload nginx so its proxy picks up the freshly restarted app
          # (a restart can leave the upstream connection stale -> 404s).
          nginx -t && systemctl reload nginx

          # Smoke check: exercise the FULL public path (local nginx server block
          # + TLS + Django) via --resolve, retrying while the app warms up. A
          # non-200 fails the deploy loudly instead of shipping a broken API.
          url="https://lawapi.dennismuasya.com/api/status/"
          ok=""
          for i in $(seq 1 10); do
            code=$(curl -sk -o /tmp/smoke.txt -w '%{http_code}' --max-time 10 \
              --resolve lawapi.dennismuasya.com:443:127.0.0.1 "$url" || echo 000)
            if [ "$code" = "200" ]; then ok=1; echo "Smoke check OK (HTTP 200) on attempt $i"; break; fi
            echo "Smoke check attempt $i: HTTP $code; retrying in 3s..."; sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::SMOKE CHECK FAILED — $url never returned 200"
            echo "--- response body ---";      head -c 500 /tmp/smoke.txt || true; echo
            echo "--- systemctl status law ---"; systemctl status law --no-pager -l | tail -30 || true
            echo "--- journalctl -u law ---";   journalctl -u law -n 50 --no-pager || true
            echo "--- listening sockets ---";   ss -ltnp | grep -E ':8000|:443|:80|law' || true
            exit 1
          fi
          EOF
