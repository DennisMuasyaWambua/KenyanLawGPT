name: wakiliai

x-gateway-env: &gateway-env
  APP_ENV: dev
  PORT: "8080"
  DATABASE_URL: postgres://wakili_app:wakili_app_pw@postgres:5432/wakili?sslmode=disable
  ADMIN_DATABASE_URL: postgres://postgres:postgres@postgres:5432/wakili?sslmode=disable
  MIGRATIONS_DIR: /migrations
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
  # Google sign-in/up (empty => Google buttons hidden, password auth only).
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Public frontend origin, used to build staff-invite accept links.
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
  # Bootstrap super-admin (platform control plane), ensured on gateway start.
  PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@ckarwithack.co.ke}
  PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-ChangeMe_Admin123!}
  AI_GRPC_ADDR: ai:50051
  AI_GRPC_SERVER_NAME: ai
  MTLS_CA_CERT: /certs/ca.crt
  MTLS_CLIENT_CERT: /certs/gateway.crt
  MTLS_CLIENT_KEY: /certs/gateway.key
  S3_ENDPOINT: minio:9000
  # Presigned URLs are minted for the host the BROWSER uses:
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:59000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_BUCKET: wakili-archives
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  AT_USERNAME: ${AT_USERNAME:-}
  AT_API_KEY: ${AT_API_KEY:-}
  DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
  DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
  DARAJA_PASSKEY: ${DARAJA_PASSKEY:-}
  DARAJA_CALLBACK_URL: ${DARAJA_CALLBACK_URL:-http://localhost:8080/webhooks/daraja/callback}
  JUDICIARY_BASE_URL: ${JUDICIARY_BASE_URL:-}
  SMTP_HOST: ${SMTP_HOST:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wakili
      POSTGRES_PASSWORD: postgres
    # Host ports: loopback-only and env-overridable so the same file works in
    # dev and behind a reverse proxy in prod (no service is publicly exposed).
    ports: ["127.0.0.1:${PG_HOST_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wakili"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-wakili-neo4j}
      # Heap/pagecache are capped low by default so Neo4j coexists with other
      # services on a small box; override upward where RAM allows.
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    ports: ["127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474", "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"]
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["127.0.0.1:${MINIO_HOST_PORT:-59000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"]
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  ai:
    build: ./services/ai
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://wakili_app:wakili_app_pw@postgres:5432/wakili
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-wakili-neo4j}
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: wakili-archives
      GRPC_PORT: "50051"
      HEALTH_PORT: "8081"
      MTLS_CA_CERT: /certs/ca.crt
      MTLS_SERVER_CERT: /certs/ai.crt
      MTLS_SERVER_KEY: /certs/ai.key
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # GMI Cloud hosted models (DeepSeek-R1 distill vs Qwen3-235B evaluation).
      GMI_CLOUD_BASE_URL: ${GMI_CLOUD_BASE_URL:-https://api.gmi-serving.com/v1}
      GMI_CLOUD_API_KEY: ${GMI_CLOUD_API_KEY:-}
      GMI_CLOUD_MODEL: ${GMI_CLOUD_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Llama-70B}
      GMI_CLOUD_DEEPSEEK_MODEL: ${GMI_CLOUD_DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Llama-70B}
      GMI_CLOUD_QWEN_MODEL: ${GMI_CLOUD_QWEN_MODEL:-Qwen/Qwen3-235B-A22B-Instruct-2507-FP8}
      GMI_SYNTHETIC_ONLY: ${GMI_SYNTHETIC_ONLY:-true}
      GMI_SYNTHETIC_DATA_OK: ${GMI_SYNTHETIC_DATA_OK:-false}
      # Multilingual speech-to-text. auto|whisper|openai|mock; cloud never auto.
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-auto}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      TRANSCRIBE_LANGUAGE: ${TRANSCRIBE_LANGUAGE:-auto}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-https://api.openai.com/v1}
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_OPENAI_MODEL: ${TRANSCRIBE_OPENAI_MODEL:-whisper-1}
      PUBLIC_INGEST_ON_START: "true"
      INGEST_OFFLINE_SAMPLES: ${INGEST_OFFLINE_SAMPLES:-true}
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      # Optional secondary provider used when the primary fails (empty => none).
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Model choice must be env-overridable: the default llama3 is an 8B model
      # (~5GB resident) that won't fit alongside the data services on a small box.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-llama3.2:1b}
      ENABLE_FIRM_INGESTION: ${ENABLE_FIRM_INGESTION:-false}
      ENABLE_JUDGE_REASONING: ${ENABLE_JUDGE_REASONING:-false}
      ENABLE_AUTO_UPDATE: ${ENABLE_AUTO_UPDATE:-false}
    ports: ["127.0.0.1:${GRPC_HOST_PORT:-50051}:50051", "127.0.0.1:${AI_HEALTH_PORT:-8081}:8081"]
    # Lets LLM_PROVIDER=ollama reach an Ollama running on the host.
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./infra/certs:/certs:ro
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8081/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway:
    build: ./services/gateway
    environment: *gateway-env
    # On a box where 8080 is taken (e.g. by another app) set GATEWAY_HOST_PORT.
    ports: ["127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8080"]
    volumes:
      - ./infra/certs:/certs:ro
      - ./infra/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      ai: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        # NEXT_PUBLIC_* is baked at build time, so Google auth needs a rebuild.
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"]
    depends_on:
      gateway: { condition: service_started }

  # One-shot jobs (also runnable via `make migrate` / `make seed`).
  migrate:
    build: ./services/gateway
    entrypoint: ["/app/migrate"]
    environment: *gateway-env
    volumes:
      - ./infra/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    build: ./services/gateway
    entrypoint: ["/app/seed"]
    environment: *gateway-env
    profiles: ["tools"]
    volumes:
      - ./infra/certs:/certs:ro
      - ./infra/migrations:/migrations:ro
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      ai: { condition: service_healthy }

volumes:
  pgdata:
  neo4jdata:
  miniodata:
