# Host nginx for Advocatus. Install:
#   cp infra/nginx/advocatus.conf /etc/nginx/sites-available/advocatus
#   ln -s /etc/nginx/sites-available/advocatus /etc/nginx/sites-enabled/ && rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d law.dennismuasya.com -d lawapi.dennismuasya.com   # after DNS points here
# Ports match docker-compose.yml defaults; the old box used GATEWAY_HOST_PORT=8090 via .env.
# Per-firm subdomains (<slug>.law.dennismuasya.com) need a wildcard cert (DNS-01 challenge).

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name law.dennismuasya.com lawapi.dennismuasya.com *.law.dennismuasya.com;
    client_max_body_size 200m;   # document + recording uploads

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# API host gets its own block (more specific server_name wins over the wildcard above).
server {
    listen 80;
    server_name lawapi.dennismuasya.com;
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8090;   # GATEWAY_HOST_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;               # SSE streaming (AI research/drafting)
        proxy_read_timeout 300s;
    }
}
